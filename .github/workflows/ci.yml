name: C++ verification
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        compiler: [g++, clang++]
        build: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DCMAKE_BUILD_TYPE=${{ matrix.build }}
      - run: cmake --build build -j 2
      - run: ctest --test-dir build --output-on-failure
      - run: ./build/scheduler_bench
  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DAETHER_SANITIZER=address,undefined
      - run: cmake --build build -j 2
      - run: ctest --test-dir build --output-on-failure
